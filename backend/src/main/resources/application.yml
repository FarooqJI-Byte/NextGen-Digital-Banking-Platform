spring:
  application:
    name: nextgen-banking-backend
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:backend/.env[.properties]"
      - "optional:file:application-local.yml"
      - "optional:file:backend/application-local.yml"
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextgen_bank}
    username: ${SPRING_DATASOURCE_USERNAME:bank_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:bank_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Resilience4j Circuit Breaker Config for AI Loan Service Call
resilience4j:
  circuitbreaker:
    instances:
      aiLoanService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
  timelimiter:
    instances:
      aiLoanService:
        timeoutDuration: 1500ms

# Application Properties
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  storage:
    kyc-upload-dir: ${KYC_UPLOAD_DIR:./data/kyc-uploads}
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  outbox:
    relay:
      cron: "*/5 * * * * *" # Run every 5 seconds
  dev-mode: ${APP_DEV_MODE:true}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
